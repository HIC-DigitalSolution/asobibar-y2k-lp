name: secrets-contract
summary: No credential enters the repository, in any file, under any name.

# This contract ships enabled and needs NO configuration. It is the one rule that is true
# of every project regardless of stack, and the one whose failure cannot be undone by a
# later commit: git history keeps what you delete, so a pushed secret must be rotated at
# the provider, not removed from the tree.
#
# Both invariants are diff-scoped, so adopting the harness in an old repo does not fail on
# day one over files nobody is touching. Run `--all` once to see the real baseline.

invariants:
  - id: credential-files-never-added
    statement: No credential file is added to the repo, whatever it is named.
    check:
      type: forbidden-path
      forbidden_paths:
        - (^|/)\.env$
        - (^|/)\.env\.(local|development|production|staging|test)$
        - \.(pem|p12|p8|pfx|key|keystore|jks)$
        - (^|/)id_(rsa|dsa|ecdsa|ed25519)$
        - (^|/)[^/]*service[-_]?account[^/]*\.json$
        - (^|/)credentials\.json$
      exempt_paths:
        - \.env\.(example|sample|template)$
      hint: 'fix: add it to .gitignore and remove it from the index (git rm --cached <file>). If it was ever pushed, rotate the credential at the provider — deleting the file does not remove it from history.'

  - id: no-credential-content-in-tracked-files
    statement: No tracked file contains a private key, a cloud access key, or a provider token.
    check:
      type: forbidden-content
      applies_to_paths:
        - \.(js|mjs|cjs|jsx|ts|tsx|vue|svelte|astro)$
        - \.(py|rb|go|rs|java|kt|swift|php|dart|cs|scala)$
        - \.(json|ya?ml|toml|ini|properties)$
        - \.(sh|bash|zsh|fish|ps1)$
        - \.(md|txt|html|htm|sql)$
      # Each pattern is written so it cannot match its own source text — note the `[_]`
      # and the bracketed classes, which match a literal character while keeping this
      # file itself clean. Without that, this contract trips its own rule and the only
      # way out is an exemption, which would then blind the rule to real hits here.
      # Do not "simplify" these back.
      forbidden_patterns:
        - '-----BEGIN [A-Z ]*PRIVATE KEY-----'
        - '"private[_]key"'
        - 'AKIA[0-9A-Z]{16}'
        - 'ghp_[A-Za-z0-9]{36}'
        - 'xox[baprs]-[0-9A-Za-z-]{10,}'
        - 'sk-[A-Za-z0-9]{32,}'
        - 'AIza[0-9A-Za-z_-]{30}'
      hint: 'fix: move the value to an environment variable and reference it at runtime. Pasting a key inline to "test quickly" is the usual way one reaches history. If it was committed, rotate it.'

  - id: secrets-reviewed-before-release
    statement: Anything the client or the browser can download carries no credential, including values injected at build time.
    check:
      type: manual
      note: no script can tell a public key from a private one by shape alone, nor see what a bundler inlines. Before a release, check the built output and any NEXT_PUBLIC_/VITE_-style variables for values that should have stayed server-side.
