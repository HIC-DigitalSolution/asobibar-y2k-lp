# Copy to harness/scenarios/ for a Next.js project.
name: build-scenario
summary: Before pushing, prove the app still lints and builds.
stage: pre-push

match:
  paths:
    - ^app/
    - ^src/
    - ^components/
    - ^lib/
    - ^public/
    - ^next\.config\.
    - ^package\.json$

requires:
  - type: command
    command: npm

steps:
  - name: lint
    run: npm run lint
  - name: build
    run: npm run build
