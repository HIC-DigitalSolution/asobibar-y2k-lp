# Copy to harness/scenarios/ for a static site with no build step.
# There is nothing to compile, so the gate is the contract itself plus a link check.
name: static-check-scenario
summary: Before pushing a static page, confirm the markup parses and no local asset is missing.
stage: pre-push

match:
  paths:
    - \.html$
    - \.css$
    - ^assets/

requires:
  - type: command
    command: python3

steps:
  - name: html parses
    run: python3 -c "import sys,glob,html.parser as p;[p.HTMLParser(convert_charrefs=True).feed(open(f,encoding='utf-8').read()) for f in glob.glob('**/*.html',recursive=True)];print('html ok')"
