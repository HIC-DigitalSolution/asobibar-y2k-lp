<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="title">
  <title id="title">PLAY TOGETHER</title>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.1" stop-color="#dcfbff"/>
      <stop offset="0.26" stop-color="#ffd8ee"/>
      <stop offset="0.54" stop-color="#ff82bf"/>
      <stop offset="0.78" stop-color="#e82b88"/>
      <stop offset="1" stop-color="#ff9dce"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d82a80"/>
      <stop offset="1" stop-color="#75043f"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff67ae"/>
      <stop offset="1" stop-color="#b10b61"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="13" stdDeviation="8" flood-color="#4f092f" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#shadow)" transform="rotate(-2 210 150)">
    <!-- 文字群を包むオリジナルのダイカット台紙。 -->
    <path
      d="M70 31C99 13 139 18 161 27C188 8 228 11 250 27C284 14 328 27 342 54C375 60 392 87 379 112C404 132 403 164 381 183C393 211 372 241 341 243C322 272 281 281 251 263C224 281 184 279 160 262C125 274 88 258 79 232C44 224 29 194 45 169C19 147 27 113 54 99C40 74 47 47 70 31Z"
      fill="#fffdfd"
      stroke="#ffffff"
      stroke-width="13"
      stroke-linejoin="round"
    />
    <path
      d="M70 31C99 13 139 18 161 27C188 8 228 11 250 27C284 14 328 27 342 54C375 60 392 87 379 112C404 132 403 164 381 183C393 211 372 241 341 243C322 272 281 281 251 263C224 281 184 279 160 262C125 274 88 258 79 232C44 224 29 194 45 169C19 147 27 113 54 99C40 74 47 47 70 31Z"
      fill="#fff9fc"
      stroke="#e7dce5"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <g font-family="Arial Rounded MT Bold, Arial Rounded Bold, Trebuchet MS, sans-serif" font-weight="900" text-anchor="middle">
      <rect x="144" y="26" width="132" height="30" rx="15" fill="url(#badge)" stroke="#ffffff" stroke-width="4"/>
      <text x="210" y="47" fill="#ffffff" font-family="Arial Black, sans-serif" font-size="13" letter-spacing="2.4">Y2K NIGHT</text>

      <!-- 白フチ → 濃い側面 → 明るい上面の順に固定して重ねる。 -->
      <text x="199" y="151" fill="url(#side)" stroke="#ffffff" stroke-width="19" stroke-linejoin="round" paint-order="stroke fill" font-size="105">PLAY</text>
      <text x="199" y="157" fill="url(#side)" stroke="#870449" stroke-width="3" stroke-linejoin="round" paint-order="stroke fill" font-size="105">PLAY</text>
      <text x="199" y="145" fill="url(#face)" stroke="#c21570" stroke-width="3" stroke-linejoin="round" paint-order="stroke fill" font-size="105">PLAY</text>

      <text x="222" y="232" fill="url(#side)" stroke="#ffffff" stroke-width="17" stroke-linejoin="round" paint-order="stroke fill" font-size="62" letter-spacing="-1.5">TOGETHER</text>
      <text x="222" y="238" fill="url(#side)" stroke="#870449" stroke-width="3" stroke-linejoin="round" paint-order="stroke fill" font-size="62" letter-spacing="-1.5">TOGETHER</text>
      <text x="222" y="226" fill="url(#face)" stroke="#c21570" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill" font-size="62" letter-spacing="-1.5">TOGETHER</text>
    </g>

    <!-- 上面の反射と小さな星。 -->
    <path d="M87 76L92 91L107 96L92 101L87 116L82 101L67 96L82 91Z" fill="#ffffff"/>
    <path d="M339 84L343 96L355 100L343 104L339 116L335 104L323 100L335 96Z" fill="#ffffff"/>
    <path d="M317 218L320 227L329 230L320 233L317 242L314 233L305 230L314 227Z" fill="#dffbff"/>
    <path d="M118 68C159 48 213 47 252 61" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.78"/>
  </g>
</svg>
